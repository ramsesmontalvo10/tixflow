services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-ticketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketing_dev}
      POSTGRES_DB: ${DB_NAME:-ticketing}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketing} -d ${DB_NAME:-ticketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/Ticketing.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5248
      ConnectionStrings__Default: Host=db;Port=5432;Database=${DB_NAME:-ticketing};Username=${DB_USER:-ticketing};Password=${DB_PASSWORD:-ticketing_dev}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY to a secret of at least 32 characters}
      Jwt__Issuer: ticketing-api
      Jwt__Audience: ticketing-clients
      RateLimit__AuthPerMinute: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
    ports:
      - "${API_PORT:-5248}:5248"
    volumes:
      - signingkey:/app/data
    depends_on:
      db:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    ports:
      - "${PORTAL_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  dbdata:
  signingkey: